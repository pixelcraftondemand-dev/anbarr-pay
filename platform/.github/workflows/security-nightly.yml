name: Security (nightly)

on:
  schedule:
    # Daily 03:17 UTC — dependency advisories and secrets are re-checked
    # against the latest databases even when nothing changed in the repo.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit (High/Critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@gitleaks
      - name: gitleaks — full git history
        run: gitleaks git --exit-code --redact --log-opts="--all --full-history" .