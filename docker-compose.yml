services:
  postgres:
    image: postgres:16
    container_name: amber-postgres
    environment:
      POSTGRES_USER: amber
      POSTGRES_PASSWORD: amber_dev
      POSTGRES_DB: amber
    ports:
      - "5433:5432"   # 5432 is taken by an existing local Postgres container
    volumes:
      - amber_pgdata:/var/lib/postgresql/data
      # The Core API's metadata database is created on first boot (the ledger
      # db `amber` is POSTGRES_DB). Boundary: ledger tables live only in
      # `amber`; core metadata (wallet links, vault goals) lives only in
      # `amber_core` — enforced by roles in deployment.
      - ./docker/init-core-db.sql:/docker-entrypoint-initdb.d/10-core-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amber -d amber"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amber_pgdata: